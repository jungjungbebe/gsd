<!DOCTYPE html>
<html>
<head>
  <style>body{margin:0;background:#0000;display:flex;justify-content:center;align-items:center;height:100vh;}</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const size = 512;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0, 4.0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size, size);
renderer.setPixelRatio(2);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const noiseGLSL = `
  vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;
    vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
    i=mod(i,289.0);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=1.0/7.0;vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }
  float fbm(vec3 p,float t){float f=0.0;float amp=0.55;float freq=1.2;
    for(int i=0;i<5;i++){f+=amp*snoise(p*freq+t);freq*=1.9;amp*=0.4;p=p.yzx;}return f;}
  float getDisp(vec3 pos,float t,float amp){return fbm(pos,t*0.25)*amp+snoise(pos*0.5+t*0.06)*amp*0.4;}
`;

const vert = `
  uniform float uTime;uniform float uNoiseAmp;
  varying vec3 vNormal;varying vec3 vViewDir;varying vec3 vWorldPos;varying float vDisp;
  ${noiseGLSL}
  void main(){
    float t=uTime*0.35;float disp=getDisp(position,t,uNoiseAmp);
    vec3 newPos=position+normal*disp;vDisp=disp;
    float eps=0.005;
    vec3 up=abs(normal.y)<0.99?vec3(0.0,1.0,0.0):vec3(1.0,0.0,0.0);
    vec3 tang=normalize(cross(up,normal));vec3 bitan=cross(normal,tang);
    vec3 pC=position+normal*disp;
    vec3 pT=(position+tang*eps)+normal*getDisp(position+tang*eps,t,uNoiseAmp);
    vec3 pB=(position+bitan*eps)+normal*getDisp(position+bitan*eps,t,uNoiseAmp);
    vec3 reN=normalize(cross(pT-pC,pB-pC));
    vNormal=normalize(normalMatrix*reN);
    vec4 wp=modelMatrix*vec4(newPos,1.0);vWorldPos=wp.xyz;
    vViewDir=normalize(cameraPosition-wp.xyz);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(newPos,1.0);
  }
`;

const frag = `
  varying vec3 vNormal;varying vec3 vViewDir;varying vec3 vWorldPos;varying float vDisp;
  void main(){
    vec3 N=normalize(vNormal);vec3 V=normalize(vViewDir);
    vec3 pinkTop=vec3(0.85,0.45,0.65);vec3 lavender=vec3(0.60,0.40,0.70);vec3 mintBot=vec3(0.30,0.72,0.82);
    float ny=N.y*0.5+0.5;
    vec3 baseColor=mix(mintBot,lavender,smoothstep(0.0,0.45,ny));
    baseColor=mix(baseColor,pinkTop,smoothstep(0.4,1.0,ny));
    float d=smoothstep(-0.05,0.2,vDisp);baseColor=mix(baseColor*0.7,baseColor*1.1,d);
    vec3 keyDir=normalize(vec3(2.0,2.0,3.0));
    float keyDiff=max(dot(N,keyDir),0.0)*0.5+0.5;keyDiff=keyDiff*keyDiff*0.6;
    float totalDiff=keyDiff+0.5;
    float ao=smoothstep(-0.15,0.08,vDisp);totalDiff*=mix(0.5,1.0,ao);
    vec3 roseGold=vec3(1.0,0.5,0.6);
    vec3 h1=normalize(keyDir+V);float spec1=pow(max(dot(N,h1),0.0),180.0)*1.2;
    float fresnel=1.0-max(dot(V,N),0.0);
    float fresnelSharp=pow(fresnel,4.0);
    vec3 rimColor=mix(vec3(0.5,0.3,0.8),vec3(0.9,0.45,0.55),ny);
    vec3 rim=rimColor*fresnelSharp*0.8;
    vec3 color=baseColor*totalDiff+roseGold*spec1+rim;
    float alpha=mix(0.82,1.0,fresnelSharp);
    gl_FragColor=vec4(color,alpha);
  }
`;

const geo = new THREE.SphereGeometry(1, 128, 128);
const mat = new THREE.ShaderMaterial({
  vertexShader: vert, fragmentShader: frag,
  transparent: true, uniforms: { uTime: {value: 0.5}, uNoiseAmp: {value: 0.12} }
});
scene.add(new THREE.Mesh(geo, mat));

renderer.render(scene, camera);

// auto-download
const link = document.createElement('a');
link.download = 'orb-avatar.png';
link.href = renderer.domElement.toDataURL('image/png');
link.click();

document.title = 'Done — check Downloads';
</script>
</body>
</html>
